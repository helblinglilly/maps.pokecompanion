name: Release maps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-maps
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run maps:completeness
      - run: npm test
      - run: npm run typecheck
      - run: npm run release:bundle
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]; then
            echo "Tag already exists; choose a new release version."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "dist/maps-$RELEASE_TAG.zip" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
